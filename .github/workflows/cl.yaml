name: Ultra Edge Deploy CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: ultraedge-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:

  validate:
    name: Validate Repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate package.json
        run: |
          test -f package.json

      - name: Validate Wrangler Config
        run: |
          if [ -f wrangler.toml ]; then
            echo "wrangler.toml found"
          else
            echo "Missing wrangler.toml"
            exit 1
          fi

  install:
    name: Install Dependencies
    runs-on: ubuntu-latest

    needs: validate

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

  lint:
    name: Lint
    runs-on: ubuntu-latest

    needs: install

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Run Linter
        run: npm run lint --if-present

  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    needs: install

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Run Tests
        run: npm test --if-present

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    needs: install

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: NPM Audit
        run: npm audit --audit-level=high

  build:
    name: Build Worker
    runs-on: ubuntu-latest

    needs:
      - lint
      - test
      - security

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build --if-present

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/develop'

    needs: build

    environment:
      name: staging

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci

      - name: Deploy Staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler deploy

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    needs: build

    environment:
      name: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci

      - name: Deploy Production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler deploy

  deployment-report:
    name: Deployment Report
    runs-on: ubuntu-latest

    needs:
      - deploy-production

    if: always()

    steps:
      - name: Summary
        run: |
          echo "Ultra Edge Deploy Pipeline Complete"
