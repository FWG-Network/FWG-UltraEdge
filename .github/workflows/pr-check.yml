# ============================================================
# FWG-UltraEdge 🌍⚡ — PR Check Pipeline
# Principal DevOps Engineer: FWG-UltraEdge Systems
# Runs on: pull_request → main | develop
# Jobs: Secret Scan → Code Quality → Static Analysis → Tests
# ============================================================

name: FWG-UltraEdge 🌍⚡ PR Check

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  actions: read
  pull-requests: write  # Allow PR comment with test results

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: latest

# ════════════════════════════════════════════════════════════
# JOB 1 — SECRET SCANNING 🔐
# ════════════════════════════════════════════════════════════
jobs:
  secret-scanning:
    name: "🔐 Job 1 · Secret Scanning"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Upload Gitleaks report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report-pr
          path: results.sarif
          retention-days: 7

# ════════════════════════════════════════════════════════════
# JOB 2 — CODE QUALITY 🎨
# ════════════════════════════════════════════════════════════
  code-quality:
    name: "🎨 Job 2 · Code Quality"
    runs-on: ubuntu-latest
    needs: secret-scanning
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Run ESLint
        run: bun x eslint . --ext .ts,.tsx --max-warnings 0

      - name: Run Prettier check
        run: bun x prettier --check "src/**/*.{ts,tsx,json}"

# ════════════════════════════════════════════════════════════
# JOB 3 — STATIC ANALYSIS 🔬
# ════════════════════════════════════════════════════════════
  static-analysis:
    name: "🔬 Job 3 · Static Analysis (TypeScript)"
    runs-on: ubuntu-latest
    needs: secret-scanning
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Run TypeScript strict type-check
        run: bun x tsc --noEmit --strict

# ════════════════════════════════════════════════════════════
# JOB 4 — ULTRA-FAST TESTING ⚡
# ════════════════════════════════════════════════════════════
  ultra-fast-testing:
    name: "⚡ Job 4 · Ultra-Fast Unit Tests"
    runs-on: ubuntu-latest
    needs: [code-quality, static-analysis]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Run unit tests
        run: bun test --coverage --reporter=junit --reporter-outfile=test-results.xml
        env:
          NODE_ENV: test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-test-results
          path: test-results.xml
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-coverage-report
          path: coverage/
          retention-days: 7
