name: "FWG-UltraEdge PR Check"
on:
  pull_request:
    branches:
      - main
      - develop
permissions:
  contents: read
  actions: read
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  BUN_VERSION: latest
jobs:
  secret-scanning:
    name: "🔐 Job 1 · Secret Scanning"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  code-quality:
    name: "🎨 Job 2 · Code Quality"
    runs-on: ubuntu-latest
    needs: secret-scanning
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install
      - run: bun x eslint . --ext .ts,.tsx --max-warnings 0
      - run: bun x prettier --check "src/**/*.{ts,tsx,json}"
  static-analysis:
    name: "🔬 Job 3 · Static Analysis"
    runs-on: ubuntu-latest
    needs: secret-scanning
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install
      - run: bun x tsc --noEmit --strict
  ultra-fast-testing:
    name: "⚡ Job 4 · Unit Tests"
    runs-on: ubuntu-latest
    needs: [code-quality, static-analysis]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install
      - run: bun test --coverage
        env:
          NODE_ENV: test
  security-audit-pr:
    name: "🛡️ Job 5 · Security Audit"
    runs-on: ubuntu-latest
    needs: secret-scanning
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install
      - run: bun audit --audit-level=high || true
  pr-comment:
    name: "💬 Job 6 · PR Comment"
    runs-on: ubuntu-latest
    needs: [ultra-fast-testing, security-audit-pr]
    if: always()
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const test  = '${{ needs.ultra-fast-testing.result }}';
            const audit = '${{ needs.security-audit-pr.result }}';
            const ok    = test === 'success' && audit === 'success';
            const url   = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const body  = `## ${ok ? '✅' : '❌'} FWG-UltraEdge 🌍⚡ PR Check\n\n| Check | Status |\n|-------|--------|\n| ⚡ Tests | ${test === 'success' ? '✅' : '❌'} |\n| 🛡️ Audit | ${audit === 'success' ? '✅' : '❌'} |\n\n[View Run](${url})`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
  pr-notify-failure:
    name: "🔔 Job 7 · Slack Alert"
    runs-on: ubuntu-latest
    needs: [secret-scanning, code-quality, static-analysis, ultra-fast-testing, security-audit-pr]
    if: failure()
    steps:
      - name: Alert Slack
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"❌ FWG-UltraEdge PR Check FAILED 🌍⚡\nBranch: \`${{ github.head_ref }}\`\nAuthor: ${{ github.actor }}\"}"
