# ============================================================
# FWG-UltraEdge 🌍⚡ — Scheduled Security Audit Pipeline
# Principal DevOps Engineer: FWG-UltraEdge Systems
# Schedule: Every Monday 00:00 UTC | Manual trigger available
# Jobs: Secret Scan → Security Audit → Static Analysis → Tests
# ============================================================

name: FWG-UltraEdge 🌍⚡ Scheduled Audit

on:
  schedule:
    - cron: "0 0 * * 1"  # Every Monday at midnight UTC
  workflow_dispatch:       # Allow manual trigger

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: latest
  WRANGLER_VERSION: latest

# ════════════════════════════════════════════════════════════
# JOB 1 — SECRET SCANNING 🔐
# ════════════════════════════════════════════════════════════
jobs:
  secret-scanning:
    name: "🔐 Job 1 · Secret Scanning"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Upload Gitleaks report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report-audit
          path: results.sarif
          retention-days: 14

# ════════════════════════════════════════════════════════════
# JOB 2 — SECURITY AUDIT 🛡️
# ════════════════════════════════════════════════════════════
  security-audit:
    name: "🛡️ Job 2 · Security Audit"
    runs-on: ubuntu-latest
    needs: secret-scanning
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Run bun audit
        run: bun audit --audit-level moderate
        continue-on-error: false

      - name: Run OSV Scanner
        run: |
          curl -fsSL https://raw.githubusercontent.com/google/osv-scanner/main/scripts/install.sh | sh -s -- -b /usr/local/bin
          osv-scanner --lockfile=bun.lockb --format=json > osv-results.json || true
          cat osv-results.json
        continue-on-error: true

      - name: Upload OSV scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osv-scan-results-audit
          path: osv-results.json
          retention-days: 14

      - name: Notify Slack — Audit vulnerabilities found
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"attachments\": [{
                \"color\": \"danger\",
                \"title\": \"🚨 FWG-UltraEdge AUDIT ALERT 🌍⚡\",
                \"text\": \"Scheduled security audit found vulnerabilities!\",
                \"fields\": [
                  {\"title\": \"Status\", \"value\": \"🔴 Vulnerabilities Detected\", \"short\": true},
                  {\"title\": \"Trigger\", \"value\": \"Scheduled Audit\", \"short\": true},
                  {\"title\": \"Branch\", \"value\": \"${{ github.ref_name }}\", \"short\": true},
                  {\"title\": \"Action\", \"value\": \"Review dependencies immediately\", \"short\": true}
                ],
                \"footer\": \"FWG-UltraEdge Scheduled Audit\",
                \"ts\": $(date +%s)
              }]
            }"

# ════════════════════════════════════════════════════════════
# JOB 3 — STATIC ANALYSIS 🔬
# ════════════════════════════════════════════════════════════
  static-analysis:
    name: "🔬 Job 3 · Static Analysis (TypeScript)"
    runs-on: ubuntu-latest
    needs: secret-scanning
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Run TypeScript strict type-check
        run: bun x tsc --noEmit --strict

# ════════════════════════════════════════════════════════════
# JOB 4 — ULTRA-FAST TESTING ⚡
# ════════════════════════════════════════════════════════════
  ultra-fast-testing:
    name: "⚡ Job 4 · Ultra-Fast Unit Tests"
    runs-on: ubuntu-latest
    needs: [security-audit, static-analysis]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Run unit tests
        run: bun test --coverage --reporter=junit --reporter-outfile=test-results.xml
        env:
          NODE_ENV: test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-test-results
          path: test-results.xml
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-coverage-report
          path: coverage/
          retention-days: 14

      - name: Notify Slack — Weekly audit complete
        if: always()
        run: |
          STATUS="${{ job.status }}"
          COLOR=$([[ "$STATUS" == "success" ]] && echo "good" || echo "danger")
          EMOJI=$([[ "$STATUS" == "success" ]] && echo "✅" || echo "❌")
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"attachments\": [{
                \"color\": \"${COLOR}\",
                \"title\": \"${EMOJI} FWG-UltraEdge Weekly Audit Complete 🌍⚡\",
                \"fields\": [
                  {\"title\": \"Status\", \"value\": \"${STATUS}\", \"short\": true},
                  {\"title\": \"Branch\", \"value\": \"${{ github.ref_name }}\", \"short\": true}
                ],
                \"footer\": \"FWG-UltraEdge Scheduled Audit\",
                \"ts\": $(date +%s)
              }]
            }"
