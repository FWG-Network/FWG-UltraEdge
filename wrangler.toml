# ============================================================
# FWG-UltraEdge 🌍⚡ — Wrangler Configuration
# Advanced Observability | Global Optimization | SLSA Ready
# Durable Objects | KV | R2 | Smart Placement
# ============================================================

name = "ultraedge-prod"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# ── FWG-UltraEdge 🌍⚡ Global Optimization ──
[placement]
mode = "smart"  # Cloudflare routes requests to nearest PoP automatically

# ── Worker limits ──
[limits]


# ── Observability: Workers Logpush (Wrangler 4.x format) ──
# ✅ FIX: logpush must be a top-level boolean — NOT an object

[observability]
enabled = true
head_sampling_rate = 1  # 100% sampling for full visibility

# ── Vars: non-secret environment variables ──
[vars]
ENVIRONMENT = "production"
APP_NAME = "FWG-UltraEdge"
APP_VERSION = "1.0.0"


# ════════════════════════════════════
# KV NAMESPACE BINDINGS
# ════════════════════════════════════
[[kv_namespaces]]
binding = "ULTRA_EDGE_KV"
id = "d23dc04c127a4918a02b3c72bade6d9d"

# ════════════════════════════════════
# R2 BUCKET BINDINGS
# ════════════════════════════════════
[[r2_buckets]]
binding = "ULTRA_EDGE_VIDEOS"
bucket_name = "ultra-edge-videos"

# ════════════════════════════════════
# DURABLE OBJECTS
# ════════════════════════════════════
[[durable_objects.bindings]]
name = "SMART_ROUTER"
class_name = "SmartRouter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SmartRouter"]

# ════════════════════════════════════
# STAGING ENVIRONMENT
# ════════════════════════════════════
[env.staging]
name = "ultraedge-stg"
workers_dev = true                          # ← ADD THIS
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[env.staging.placement]
mode = "smart"

[env.staging.observability]
enabled = true
head_sampling_rate = 1

[env.staging.vars]
ENVIRONMENT = "staging"
APP_NAME = "FWG-UltraEdge"
APP_VERSION = "1.0.0-stg"

[[env.staging.kv_namespaces]]
binding = "ULTRA_EDGE_KV"
id = "d23dc04c127a4918a02b3c72bade6d9d"

[[env.staging.r2_buckets]]
binding = "ULTRA_EDGE_VIDEOS"
bucket_name = "ultra-edge-videos"

[[env.staging.durable_objects.bindings]]
name = "SMART_ROUTER"
class_name = "SmartRouter"

# ════════════════════════════════════
# PRODUCTION ENVIRONMENT
# ════════════════════════════════════
[env.production]
name = "ultraedge-prod"
workers_dev = true                          # ← ADD THIS
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[env.production.placement]
mode = "smart"

# ════════════════════════════════════
# PRODUCTION BINDINGS (explicit)
# ════════════════════════════════════
[env.production.vars]
ENVIRONMENT = "production"
APP_NAME = "FWG-UltraEdge"
APP_VERSION = "3.0.0"

[[env.production.kv_namespaces]]
binding = "ULTRA_EDGE_KV"
id = "d23dc04c127a4918a02b3c72bade6d9d"

[[env.production.r2_buckets]]
binding = "ULTRA_EDGE_VIDEOS"
bucket_name = "ultra-edge-videos"

[[env.production.durable_objects.bindings]]
name = "SMART_ROUTER"
class_name = "SmartRouter"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["SmartRouter"]
