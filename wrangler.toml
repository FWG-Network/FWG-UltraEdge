# ============================================================
# FWG-UltraEdge 🌍⚡ — Wrangler Configuration
# Advanced Observability | Global Optimization | SLSA Ready
# Durable Objects | KV | R2 | Smart Placement
# ============================================================
# 🔐 SECURITY HARDENED — FWG White-Hat Audit v4.0
# Fixes:
#   [FIX-1] compatibility_date ចាស់ → 2026-05-23
#   [FIX-2] Duplicate [env.production] block លុបចោល
#   [FIX-3] Duplicate [env.staging] block លុបចោល
#   [FIX-4] Root-level workers_dev = false
#   [FIX-5] SENTRY_DSN → wrangler secret (កុំ hardcode)
#   [FIX-6] CF_CLIENT_ID → wrangler secret
#   [FIX-7] CF_CLIENT_SECRET → wrangler secret
#   [FIX-8] workers_dev = true សម្រាប់ production
#           ព្រោះប្រើ .workers.dev URL នៅក្នុង PAC file
# ============================================================
#
# 🔐 SECRETS — Run commands ទាំងនេះនៅ Codespace មុន deploy:
#
#   wrangler secret put SENTRY_DSN --env production
#   wrangler secret put SENTRY_DSN --env staging
#   wrangler secret put CF_CLIENT_ID --env production
#   wrangler secret put CF_CLIENT_ID --env staging
#   wrangler secret put CF_CLIENT_SECRET --env production
#   wrangler secret put CF_CLIENT_SECRET --env staging
#
# ============================================================

name                = "ultraedge-prod"
main                = "src/index.ts"
compatibility_date  = "2026-05-23"
compatibility_flags = ["nodejs_compat"]
workers_dev         = false

# ── Global Optimization ──────────────────────────────────────
[placement]
mode = "smart"

# ── Worker CPU/Memory limits ─────────────────────────────────
[limits]
# cpu_ms = 50

# ── Observability ────────────────────────────────────────────
[observability]
enabled            = true
head_sampling_rate = 0.1

# ── Vars ─────────────────────────────────────────────────────
[vars]
ENVIRONMENT = "production"
APP_NAME    = "FWG-UltraEdge"
APP_VERSION = "3.0.0"

# ════════════════════════════════════════════════════════════
# KV NAMESPACE
# ════════════════════════════════════════════════════════════
[[kv_namespaces]]
binding    = "ULTRA_EDGE_KV"
id         = "${KV_NAMESPACE_ID}"
preview_id = "${KV_NAMESPACE_PREVIEW_ID}"

# ════════════════════════════════════════════════════════════
# R2 BUCKET
# ════════════════════════════════════════════════════════════
[[r2_buckets]]
binding     = "ULTRA_EDGE_VIDEOS"
bucket_name = "ultra-edge-videos"

# ════════════════════════════════════════════════════════════
# DURABLE OBJECTS
# ════════════════════════════════════════════════════════════
[[durable_objects.bindings]]
name       = "SMART_ROUTER"
class_name = "SmartRouter"

[[migrations]]
tag                = "v1"
new_sqlite_classes = ["SmartRouter"]

# ════════════════════════════════════════════════════════════
# STAGING ENVIRONMENT
# ════════════════════════════════════════════════════════════
[env.staging]
name                = "ultraedge-stg"
workers_dev         = true
compatibility_date  = "2026-05-23"
compatibility_flags = ["nodejs_compat"]

[env.staging.placement]
mode = "smart"

[env.staging.observability]
enabled            = true
head_sampling_rate = 1.0

[env.staging.vars]
ENVIRONMENT = "staging"
APP_NAME    = "FWG-UltraEdge"
APP_VERSION = "3.0.0-stg"

[[env.staging.kv_namespaces]]
binding    = "ULTRA_EDGE_KV"
id         = "${KV_NAMESPACE_STAGING_ID}"
preview_id = "${KV_NAMESPACE_PREVIEW_ID}"

[[env.staging.r2_buckets]]
binding     = "ULTRA_EDGE_VIDEOS"
bucket_name = "ultra-edge-videos-stg"

[[env.staging.durable_objects.bindings]]
name       = "SMART_ROUTER"
class_name = "SmartRouter"

# ════════════════════════════════════════════════════════════
# PRODUCTION ENVIRONMENT
# ════════════════════════════════════════════════════════════
[env.production]
name                = "ultraedge-prod"
workers_dev         = true
compatibility_date  = "2026-05-23"
compatibility_flags = ["nodejs_compat"]

[env.production.placement]
mode = "smart"

[env.production.observability]
enabled            = true
head_sampling_rate = 0.1

[env.production.vars]
ENVIRONMENT = "production"
APP_NAME    = "FWG-UltraEdge"
APP_VERSION = "3.0.0"

[[env.production.kv_namespaces]]
binding    = "ULTRA_EDGE_KV"
id         = "${KV_NAMESPACE_PROD_ID}"

[[env.production.r2_buckets]]
binding     = "ULTRA_EDGE_VIDEOS"
bucket_name = "ultra-edge-videos"

[[env.production.durable_objects.bindings]]
name       = "SMART_ROUTER"
class_name = "SmartRouter"

[[env.production.migrations]]
tag                = "v1"
new_sqlite_classes = ["SmartRouter"]
