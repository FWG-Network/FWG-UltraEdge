# ============================================================
# FWG-UltraEdge 🌍⚡ — Wrangler Configuration
# Advanced Observability | Global Optimization | SLSA Ready
# Durable Objects | KV | R2 | Smart Placement
# ============================================================

name                = "ultraedge-prod"
main                = "src/index.ts"
compatibility_date  = "2026-05-23"
compatibility_flags = ["nodejs_compat"]
workers_dev         = false   # set true if PAC requires .workers.dev

[cache]
enabled = true

[placement]
mode = "smart"


[observability]
enabled            = true
head_sampling_rate = 0.1

[vars]
ENVIRONMENT = "production"
APP_NAME    = "FWG-UltraEdge"
APP_VERSION = "3.4.0"

# ════════════════════════════════════════════════════════════
# KV NAMESPACE — replace with actual IDs
# ════════════════════════════════════════════════════════════
[[kv_namespaces]]
binding    = "ULTRA_EDGE_KV"
id         = "${KV_NAMESPACE_ID}"
preview_id = "${KV_NAMESPACE_PREVIEW_ID}"

# ════════════════════════════════════════════════════════════
# R2 BUCKET
# ════════════════════════════════════════════════════════════
[[r2_buckets]]
binding     = "ULTRA_EDGE_VIDEOS"
bucket_name = "ultra-edge-videos"

# ════════════════════════════════════════════════════════════
# DURABLE OBJECTS
# ════════════════════════════════════════════════════════════
[[durable_objects.bindings]]
name       = "SMART_ROUTER"
class_name = "SmartRouter"

[[migrations]]
tag                = "v1"
new_sqlite_classes = ["SmartRouter"]

# ════════════════════════════════════════════════════════════
# STAGING ENVIRONMENT
# ════════════════════════════════════════════════════════════
[env.staging]
name                = "ultraedge-stg"
workers_dev         = true
compatibility_date  = "2026-05-23"
compatibility_flags = ["nodejs_compat"]

[env.staging.cache]
enabled = true

[env.staging.placement]
mode = "smart"

[env.staging.observability]
enabled            = true
head_sampling_rate = 1.0

[env.staging.vars]
ENVIRONMENT = "staging"
APP_NAME    = "FWG-UltraEdge"
APP_VERSION = "3.4.0-stg"

[[env.staging.kv_namespaces]]
binding    = "ULTRA_EDGE_KV"
id         = "REAL_STAGING_KV_ID"
preview_id = "REAL_STAGING_PREVIEW_ID"

[[env.staging.r2_buckets]]
binding     = "ULTRA_EDGE_VIDEOS"
bucket_name = "ultra-edge-videos-stg"

[[env.staging.durable_objects.bindings]]
name       = "SMART_ROUTER"
class_name = "SmartRouter"

# ════════════════════════════════════════════════════════════
# PRODUCTION ENVIRONMENT
# ════════════════════════════════════════════════════════════
[env.production]
name                = "ultraedge-prod"
workers_dev         = false   # set true if PAC requires .workers.dev
compatibility_date  = "2026-05-23"
compatibility_flags = ["nodejs_compat"]

[env.production.cache]
enabled = true

[env.production.placement]
mode = "smart"

[env.production.observability]
enabled            = true
head_sampling_rate = 0.1

[env.production.vars]
ENVIRONMENT = "production"
APP_NAME = "FWG-UltraEdge"
APP_VERSION = "3.4.0"
BACKEND_URL = "https://httpbingo.org"

[[env.production.kv_namespaces]]
binding    = "ULTRA_EDGE_KV"
id         = "c81769ba55e7455795ab87878f71d67f"

[[env.production.r2_buckets]]
binding     = "ULTRA_EDGE_VIDEOS"
bucket_name = "ultra-edge-videos"

[[env.production.durable_objects.bindings]]
name       = "SMART_ROUTER"
class_name = "SmartRouter"

[[env.production.migrations]]
tag                = "v1"
new_sqlite_classes = ["SmartRouter"]

[env.production.ai]
binding = "ULTRA_EDGE_AI_TRAFFIC"

[[env.production.analytics_engine_datasets]]
binding = "ULTRA_EDGE_TRAFFIC_METRICS"
dataset = "ultra_edge_traffic"

[[env.production.d1_databases]]
binding = "ULTRA_EDGE_DB"
database_name = "ultra-edge-analytics-db"
database_id = "cfeed72e-bfb1-45ea-b170-82e3ffac452a"
